services:
  - type: web
    name: stackly-oneerp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_BASE_URL
        value: https://final-version-hy5r.onrender.com
      - key: SMTP_PROVIDER
        value: gmail
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stackly-oneerp-db
          property: connectionString

databases:
  - name: stackly-oneerp-db
    databaseName: stackly_oneerp
    user: stackly_oneerp_user
    plan: basic-256mb
