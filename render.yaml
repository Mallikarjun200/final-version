services:
  - type: web
    name: stackly-oneerp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: stackly-oneerp-db
          property: connectionString

databases:
  - name: stackly-oneerp-db
    databaseName: stackly_oneerp
    user: stackly_oneerp_user
    plan: basic-256mb
